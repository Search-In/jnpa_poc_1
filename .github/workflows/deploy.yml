name: Build & Deploy to EC2

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "24"
  DEPLOY_DIR: "/home/ec2-user/jnpa_poc_1"
  # Refuse to deploy below this much free space on the EC2 root volume. The
  # SPA tarball is ~10MB, nginx image ~100MB, and the Gen-2 model image
  # (LightGBM + sklearn) is ~800MB–1.2GB on first build; 3GB leaves room for
  # the upload, both image builds, and one previous generation to prune.
  MIN_FREE_MB: "3072"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: npm ci

      # -----------------------------
      # Build Application
      # -----------------------------
      # What this artefact actually is — a MIXED build, deliberately:
      #
      #   SIMULATED : vessel fleet, berths, berthing plan, marine KPIs, DUKC/tide,
      #               what-if. Driven by MockAdapter; badged SIMULATED in-app by
      #               DataModeChip + SourceBadge.
      #   REAL      : every UC-3 gateway panel (shipping lines, vessel calls,
      #               pilotage, bathymetry, port craft, performance), the Live-AIS
      #               map overlay (MarineTraffic, on toggle), and the LDB
      #               container track when a token is supplied.
      #
      # `VITE_DATA_MODE` and `VITE_UC3_ENABLED` are ORTHOGONAL on purpose (see the
      # note on `env.uc3` in src/data/config.ts): gateway records are real whether
      # or not the AIS fleet is simulated. The full split is tabulated in
      # docs/DEPLOYMENT.md § "What is real in the deployed build".
      #
      # Every switch that changes what a reviewer sees is pinned EXPLICITLY below,
      # even where it matches the current default in src/data/config.ts — so a
      # later change to those defaults cannot silently alter the submission build.
      - name: Build Vite Application
        env:
          VITE_DATA_MODE: mock
          VITE_UC3_ENABLED: "true"
          VITE_UC3_API_BASE: "/api"
          # Vessels on the map/feed come from the UC-3 corpus, placed by berth,
          # anchorage and channel geometry (badged DERIVED, never claimed as AIS).
          # "false" would swap them for the mock fleet — a visible change, so it is
          # pinned rather than inherited from the config default.
          VITE_UC3_DERIVED_VESSELS: "true"
          # Turns on the sign-in gate. Users authenticate against the UC-3
          # gateway's POST /api/auth/login with their own DTCCC account, so there
          # are no VITE_UC3_USERNAME / VITE_UC3_PASSWORD secrets any more — Vite
          # inlined those into the JS bundle where anyone with devtools could
          # read them. Delete both from the repository secrets; nothing reads them.
          VITE_AUTH_ENABLED: "true"
          VITE_LIVE_AIS_ENABLED: "true"
          # Poll period for the live-AIS feed. ONE poller serves the map overlay and
          # the Vessels > AIS Feed > Live table together (src/map/liveVesselStore.ts),
          # so this is the build's TOTAL live-AIS request rate, not the rate per
          # surface. Clamped to a 60 s floor in config.ts — the gateway's own cache
          # TTL, below which a poll can only return identical rows.
          VITE_LIVE_AIS_POLL_MS: "300000"
          VITE_LDB_ENABLED: "true"
          # Gen-2 model panels (TAT / berth optimiser). Served same-origin at
          # /ml-api → uc1-ml:8100 on the compose network (never published).
          VITE_ML_ENABLED: "true"
          VITE_ML_API_BASE: "/ml-api"
        run: |
          node --max-old-space-size=4096 ./node_modules/.bin/vite build

      # -----------------------------
      # Upload Build Artifact (Optional)
      # -----------------------------
      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 5

      # -----------------------------
      # Setup SSH
      # -----------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # -----------------------------
      # Verify Deployment Directory
      # -----------------------------
      # Also guards free disk space. Without this, a full root volume surfaces
      # only as `scp: write remote ...: Failure` — the SFTP layer scp now runs
      # over reports a generic SSH_FX_FAILURE and swallows ENOSPC. Fail here
      # instead, with df output, so the cause is on the first screen of the log.
      - name: Verify Deployment Directory
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

          if [ ! -d "${{ env.DEPLOY_DIR }}" ]; then
            echo "❌ Deployment directory does not exist."
            exit 1
          fi

          echo "✅ Deployment directory found."

          df -h ${{ env.DEPLOY_DIR }}

          AVAIL_MB=\$(df -Pm ${{ env.DEPLOY_DIR }} | awk 'NR==2 {print \$4}')

          if [ "\$AVAIL_MB" -lt ${{ env.MIN_FREE_MB }} ]; then
            echo "❌ Only \${AVAIL_MB}MB free, need ${{ env.MIN_FREE_MB }}MB."
            echo "   Reclaim space:  docker image prune -af && docker builder prune -af"
            exit 1
          fi

          echo "✅ Disk space OK (\${AVAIL_MB}MB free)."

          # Drop any partial upload left by a previous failed run, so the scp
          # below starts clean rather than writing over a truncated archive.
          rm -f ${{ env.DEPLOY_DIR }}/deploy.tar.gz

          EOF

      # -----------------------------
      # Package Deployment Files
      # -----------------------------
      - name: Package Deployment Files
        run: |
          # SPA + nginx image context, plus the Gen-2 model service build context.
          # Exclude venv / tests / docs / DSR corpus so the tarball stays small;
          # ml/Dockerfile installs deps inside the image.
          tar -czf deploy.tar.gz \
            --exclude='ml/.venv' \
            --exclude='ml/**/__pycache__' \
            --exclude='ml/.pytest_cache' \
            --exclude='ml/tests' \
            --exclude='ml/docs' \
            --exclude='ml/out' \
            --exclude='ml/data/corpus' \
            --exclude='ml/*.md' \
            dist \
            Dockerfile \
            docker-compose.yml \
            deploy/nginx.conf \
            ml

      # -----------------------------
      # Upload Package
      # -----------------------------
      - name: Upload Package to EC2
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            deploy.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/

      # -----------------------------
      # Deploy on EC2
      # -----------------------------
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

          set -e

          cd ${{ env.DEPLOY_DIR }}

          echo "Extracting deployment package..."

          # Replace dist rather than merge into it: tar overwrites what it
          # carries but leaves behind files the new build no longer emits,
          # and nginx would go on serving those stale hashed chunks.
          rm -rf dist

          tar -xzf deploy.tar.gz

          rm -f deploy.tar.gz

          # Build BEFORE stopping anything — the running container keeps
          # serving if the build fails, instead of leaving the site down.
          echo "Building new images (SPA + Gen-2 model service)..."

          docker compose build

          echo "Starting containers..."

          docker compose up -d --force-recreate

          echo "Running containers..."

          docker compose ps

          echo "Waiting for application..."

          sleep 15

          # Smoke the model proxy (nginx → uc1-ml). Soft-fail: SPA still serves
          # if ML is warming up; the Predictions panel shows its own notice.
          if curl -sf "http://127.0.0.1/ml-api/health" >/dev/null; then
            echo "✅ /ml-api/health OK"
          else
            echo "⚠️  /ml-api/health not ready yet — check: docker compose logs uc1-ml"
          fi

          # Reclaim the images and cache this deploy just orphaned. Safe with
          # -a because the container is already up and holds a reference to
          # the image it runs; only previous deploys' leftovers are removed.
          # Skipping this is what filled the 8GB root volume.
          echo "Pruning old images and build cache..."

          docker image prune -af

          docker builder prune -af

          df -h ${{ env.DEPLOY_DIR }}

          echo "✅ Deployment completed successfully."

          EOF

      # -----------------------------
      # Cleanup Local Package
      # -----------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -f deploy.tar.gz
          rm -f ~/.ssh/deploy_key

      # -----------------------------
      # Success Notification
      # -----------------------------
      - name: Success
        if: success()
        run: echo "🎉 Deployment completed successfully."

      # -----------------------------
      # Failure Notification
      # -----------------------------
      - name: Failure
        if: failure()
        run: echo "❌ Deployment failed. Check workflow logs."