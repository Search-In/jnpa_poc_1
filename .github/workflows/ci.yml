# Quality gate — the mechanism that keeps audit/PRODUCTION_ACCEPTANCE.md Gates 1
# and 2 honest rather than aspirational.
#
# Until this file existed, `deploy.yml` was the only workflow and it went
# straight from `npm ci` to `vite build`: nothing ran lint, typecheck or the test
# suite. The zero-warning gate was documented, believed, and quietly broken (5
# warnings, including a per-render raster rebuild in the 3D map).
#
# DELIBERATELY NOT WIRED INTO deploy.yml (no `needs:`) before the expert demo. A
# hard gate means one flaky test blocks a demo-morning hotfix deploy, which is a
# worse outcome than an advisory gate a human reads. Make it blocking once the
# demo window closes.
name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint · typecheck · tests · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # `eslint . --max-warnings 0` — the gate PRODUCTION_ACCEPTANCE.md claims.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Also proves VITE_DATA_MODE validation: an unrecognised value throws in
      # vite.config.ts, so a typo in deploy.yml's env block would fail here first
      # instead of shipping a bundle that serves simulated data as if it were real.
      - name: Build
        run: node --max-old-space-size=4096 ./node_modules/.bin/vite build

  # The AI/ML side (ml/) — the eight UC-I models behind the Predictions column.
  # Separate job, not extra steps in `quality`: it needs Python, not Node, and a
  # model regression must be readable as a model regression rather than as a
  # frontend failure.
  #
  models:
    name: UC-1 models · self-tests · adapter contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Every model module imports NOTHING outside the standard library, so this
      # step runs BEFORE any install: if it fails, a dependency crept into a file
      # that is supposed to be liftable into another codebase on its own.
      - name: Models run on a bare Python install
        run: |
          for f in src/uc1_models/uc1_m*.py; do
            echo "--- $f"
            python "$f" > /dev/null || exit 1
          done

      - name: Install service dependencies
        run: pip install -r requirements-service.txt pytest

      # The gate on the duplicated DUKC core: four modules carry a byte-identical
      # copy, and the app refuses to start if they have drifted or if any
      # golden-value self-test fails. Importing the app IS the check.
      - name: DUKC core consistency + adapter mount
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src/pipeline')
          import jnpa_paths; jnpa_paths.ensure_on_syspath()
          import api
          assert api.CORE_CHECK['consistent'], api.CORE_CHECK
          assert api.ADAPTER['mounted'], api.ADAPTER
          print(f"{len(api.MOUNTED)} models + {api.ADAPTER['module_id']} mounted")
          PY

      - name: Live-AIS adapter self-test
        run: python src/pipeline/uc1_webapp_adapter.py --selftest

      # The whole suite: nothing in it needs the document corpus, which is not in
      # this repository (ml/data/corpus/README.md), because the numbers the
      # models read were already reduced into data/reference/.
      - name: Model regression suite
        run: pytest -q
