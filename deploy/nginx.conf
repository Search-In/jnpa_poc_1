# This file is included inside the http {} block
# Only server {} blocks belong here.

##############################################
# HTTP
##############################################
server {
    listen 80;
    server_name vessel-one.searchintech.in;

    # Directory used by Certbot for HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health endpoint (optional to keep over HTTP)
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

##############################################
# HTTPS
##############################################
server {
    listen 443 ssl http2;
    server_name vessel-one.searchintech.in;

    ssl_certificate /etc/letsencrypt/live/vessel-one.searchintech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vessel-one.searchintech.in/privkey.pem;

    # Recommended TLS versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optional security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # ---- UC-3 gateway reverse proxy (REST API: /api/auth/*, /api/marine/*, …) ----
    # MUST come before `location /`: without it, /api/* falls through to the SPA
    # fallback (try_files … /index.html) and a POST to that static file returns 405.
    # This block forwards /api/* to the UC-3 gateway so POST /api/auth/login reaches
    # FastAPI.
    #
    # UC-1 (this EC2) and UC-3 run on SEPARATE hosts / Docker networks, so the gateway
    # is reached over its PUBLIC HTTPS URL — NOT a Docker service name like gateway:8000.
    # The literal hostname is resolved by the system resolver at startup (stable public
    # DNS); reload nginx if the gateway's DNS record ever changes.
    location /api/ {
        proxy_pass https://traffic-three.searchintech.in;
        proxy_http_version 1.1;

        # The upstream is a TLS vhost: send SNI so the correct Let's Encrypt certificate
        # is negotiated, and a Host that matches the gateway's server_name so its nginx
        # routes to the right server block (NOT $host = vessel-one, a different vhost).
        proxy_ssl_server_name on;
        proxy_set_header Host traffic-three.searchintech.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        # UC-1 marine/berthing/shipping uploads reach ~10 MB; nginx's 1 MB default
        # would 413 before the request hits the gateway.
        client_max_body_size 25m;
    }

    # NLDS Logistics Data Bank — container track by id (Vessels ▸ Track by Container).
    # Mirrors the Vite `/ldb-proxy` rewrite so the SPA stays same-origin.
    location /ldb-proxy/ {
        proxy_pass https://ldb.co.in/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ldb.co.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React / Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }
}