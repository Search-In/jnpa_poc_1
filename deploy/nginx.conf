# This file is included inside the http {} block
# Only server {} blocks belong here.

##############################################
# HTTP
##############################################
server {
    listen 80;
    server_name vessel-one.searchintech.in;

    # Directory used by Certbot for HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health endpoint (optional to keep over HTTP)
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

##############################################
# HTTPS
##############################################
server {
    listen 443 ssl http2;
    server_name vessel-one.searchintech.in;

    ssl_certificate /etc/letsencrypt/live/vessel-one.searchintech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vessel-one.searchintech.in/privkey.pem;

    # Recommended TLS versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optional security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # React / Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }
}