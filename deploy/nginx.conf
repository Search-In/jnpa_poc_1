# nginx site config for the UC-1 SPA (spec D-1/D-2/D-6).
# - unprivileged port 8080 (non-root)
# - /health endpoint for the System Health page / orchestrator probes
# - SPA history fallback
# - baseline security headers

server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Liveness/readiness probe (spec D-2).
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }

    # SPA history fallback — any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers (spec D-6). CSP is intentionally strict; adjust
    # only if a future feature needs an additional source.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Cache immutable hashed assets aggressively; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|glb)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
