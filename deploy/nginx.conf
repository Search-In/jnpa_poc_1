# This file is included inside the http {} block
# Only server {} / upstream {} blocks belong here.

##############################################
# UC-3 gateway upstream (the shared JNPA backend)
#
# The SPA calls every backend endpoint via the RELATIVE prefix /api (see
# src/data/uc3/client.ts — "no CORS, no preflight"), which the Vite dev server
# proxies in development. This upstream is the PRODUCTION equivalent; without it
# every /api/* call falls into the SPA fallback and returns index.html.
#
# Point it at the host running jnpa-uc3-poc's gateway (docker publishes 8000).
# On a single-host deploy the default below is correct; on the multi-host demo
# topology replace with the gateway EC2's private IP/DNS.
##############################################
upstream uc3_gateway {
    server 127.0.0.1:8000;
}

##############################################
# HTTP
##############################################
server {
    listen 80;
    server_name vessel-one.searchintech.in;

    # Directory used by Certbot for HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health endpoint (optional to keep over HTTP)
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

##############################################
# HTTPS
##############################################
server {
    listen 443 ssl http2;
    server_name vessel-one.searchintech.in;

    ssl_certificate /etc/letsencrypt/live/vessel-one.searchintech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vessel-one.searchintech.in/privkey.pem;

    # Recommended TLS versions
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optional security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # UC-3 gateway API — mirrors the Vite dev proxy ('/api' → gateway:8000).
    # MUST come before the SPA fallback or every API call gets index.html.
    location /api/ {
        proxy_pass https://traffic-three.searchintech.in;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host traffic-three.searchintech.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /api/ws (event bus).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 25m;   # marine/berthing uploads (gateway caps at 10 MB)
    }

    # UC-1 Gen-2 model service (ml/ — LightGBM TAT / berth optimiser).
    # Mirrors Vite `/ml-api` → compose service uc1-ml:8100. MUST come before
    # `location /`. The service has no auth of its own — never publish :8100
    # on the host; only this proxy (same Docker network) may reach it.
    location /ml-api/ {
        proxy_pass http://uc1-ml:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
    }

    # AISHub public station map — mirrors the Vite dev proxy so the hybrid AIS
    # overlay works in production without exposing the browser to CORS failures.
    location /aishub-proxy/ {
        proxy_pass https://www.aishub.net/;
        proxy_set_header Host www.aishub.net;
        proxy_set_header Referer "https://www.aishub.net/";
        proxy_set_header X-Requested-With XMLHttpRequest;
        proxy_ssl_server_name on;
    }

    # NLDS Logistics Data Bank — container track by id (Vessels ▸ Track by Container).
    # Mirrors the Vite `/ldb-proxy` path so the SPA stays same-origin.
    # Azure App Gateway WAF 403s browser Origin/Referer/Accept from this host —
    # override those and never forward X-Forwarded-Host=our-host (also 403s).
    location /ldb-proxy/ {
        proxy_pass https://ldb.co.in/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ldb.co.in;
        proxy_set_header Origin https://ldb.co.in;
        proxy_set_header Referer https://ldb.co.in/ldb/searate/;
        proxy_set_header Accept application/json;
        proxy_set_header X-Forwarded-Host ldb.co.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
    }

    # React / Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets. Content-hashed by Vite, so a new build never collides with
    # a cached entry and `immutable` is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3D models (public/models — vendored glTF: cranes, hulls, yard containers).
    #
    # These are 5.7 MB in total and the walkthrough needs ~1.2 MB of them before
    # it reads as JNPA. On a 3G handset that is around twenty seconds, and in
    # stereo it is fetched by each of the two SceneViews — so leaving them
    # uncacheable (which is what happened while `.glb` was missing from the list
    # above) meant paying that on every entry into the immersive view.
    #
    # NOT `immutable`, unlike the hashed bundles: these keep their filenames
    # across builds, so a replaced mesh has to be able to propagate. Thirty days
    # is far longer than any demo cycle and short enough that a model swap lands
    # without a cache-busting rename.
    location ~* \.(glb|gltf|bin|ktx2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"uc1-vtms"}';
    }
}