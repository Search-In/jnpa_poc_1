# One-command run of the UC-1 SPA (spec D-1): `docker compose up`.
# Serves the static bundle on http://localhost:80 as a non-root user, mock
# mode (no credentials). Put a TLS-terminating reverse proxy in front for
# production (see docs/DEPLOYMENT.md).

version: '3.8'
services:
  uc1-vtms:
    image: uc1-vtms:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    restart: unless-stopped
    environment:
      - VITE_DATA_MODE=mock
