# One-command run of the UC-1 SPA (spec D-1): `docker compose up`.
# Serves the static bundle on http://localhost:80 as a non-root user, mock
# mode (no credentials). Put a TLS-terminating reverse proxy in front for
# production (see docs/DEPLOYMENT.md).

version: '3.8'
services:
  uc1-vtms:
    image: uc1-vtms:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    restart: unless-stopped
    environment:
      - VITE_DATA_MODE=mock
    # nginx resolves `uc1-ml` for the /ml-api block at startup, so the SPA
    # container must not come up before the model service exists.
    depends_on:
      - uc1-ml

  # The eight WS2 UC-I models (ml/). Reached ONLY through the SPA container's
  # nginx at /ml-api — deliberately NOT published to a host port, because the
  # service takes no auth of its own and answers to whoever can reach it.
  uc1-ml:
    image: uc1-ml:local
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8100"
    environment:
      - JNPA_HOST=0.0.0.0
      - JNPA_PORT=8100
    healthcheck:
      # /health re-exposes the DUKC core fingerprint and the adapter mount, so
      # a healthy container is one whose safety physics agree across all four
      # copies — not merely one whose port is open.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
