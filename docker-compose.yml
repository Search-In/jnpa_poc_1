# One-command run of the UC-1 SPA (spec D-1): `docker compose up`.
# Serves the static bundle on http://localhost:8080 as a non-root user, mock
# mode (no credentials). Put a TLS-terminating reverse proxy in front for
# production (see docs/DEPLOYMENT.md).

services:
  uc1-vtms:
    build:
      context: .
      dockerfile: Dockerfile
    image: uc1-vtms:local
    container_name: uc1-vtms
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
