<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Berth / quay marker: bollard on a quay edge. -->
  <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#0079c1" stroke-width="2"/>
  <!-- quay edge -->
  <rect x="5" y="19" width="22" height="6" rx="1" fill="#0079c1" opacity="0.85"/>
  <!-- bollard (top-down: cap + base) -->
  <circle cx="16" cy="13" r="5.5" fill="#34495e" stroke="#0079c1" stroke-width="1.4"/>
  <circle cx="16" cy="13" r="2.4" fill="#1c2833"/>
  <!-- mooring lines -->
  <line x1="16" y1="13" x2="9" y2="22" stroke="#0079c1" stroke-width="1.4"/>
  <line x1="16" y1="13" x2="23" y2="22" stroke="#0079c1" stroke-width="1.4"/>
</svg>
