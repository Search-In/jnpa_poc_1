<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 80" width="48" height="80">
  <!-- Top-down harbour tug — short, broad, prominent wheelhouse. Bow up. -->
  <defs>
    <linearGradient id="hullTug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#922b21"/>
      <stop offset="0.5" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#7b241c"/>
    </linearGradient>
  </defs>
  <!-- broad hull, rounded bow -->
  <path d="M24 4
           C 34 8, 38 16, 38 26
           L 38 66 C 38 71, 35 74, 30 74 L 18 74
           C 13 74, 10 71, 10 66 L 10 26
           C 10 16, 14 8, 24 4 Z"
        fill="url(#hullTug)" stroke="#5b1a13" stroke-width="1.4"/>
  <!-- foredeck (towing area) -->
  <path d="M24 12 C 31 16, 33 21, 33 28 L 15 28 C 15 21, 17 16, 24 12 Z" fill="#e74c3c"/>
  <!-- wheelhouse -->
  <rect x="15" y="34" width="18" height="20" rx="2" fill="#ecf0f1" stroke="#5b1a13" stroke-width="1"/>
  <rect x="18" y="37" width="12" height="10" rx="1" fill="#5d6d7e"/>
  <!-- aft towing deck + winch -->
  <rect x="16" y="58" width="16" height="12" rx="1.5" fill="#cb4335"/>
  <circle cx="24" cy="64" r="3.5" fill="#34495e" stroke="#1c2833" stroke-width="0.8"/>
</svg>
