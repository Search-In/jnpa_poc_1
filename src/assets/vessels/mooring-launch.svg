<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 72" width="40" height="72">
  <!-- Top-down mooring/line boat — small workboat, open aft deck. Bow up. -->
  <defs>
    <linearGradient id="hullMoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6091"/>
      <stop offset="0.5" stop-color="#2980b9"/>
      <stop offset="1" stop-color="#154e6b"/>
    </linearGradient>
  </defs>
  <path d="M20 3
           C 27 11, 30 19, 30 30
           L 30 60 C 30 65, 27 68, 23 68 L 17 68
           C 13 68, 10 65, 10 60 L 10 30
           C 10 19, 13 11, 20 3 Z"
        fill="url(#hullMoor)" stroke="#0e3a55" stroke-width="1.3"/>
  <!-- small cabin forward -->
  <rect x="13" y="22" width="14" height="14" rx="2" fill="#d6eaf8" stroke="#0e3a55" stroke-width="0.9"/>
  <rect x="15" y="24" width="10" height="7" rx="1" fill="#5499c7"/>
  <!-- open aft working deck with bitts -->
  <rect x="13" y="40" width="14" height="24" rx="1.5" fill="#5dade2"/>
  <circle cx="16" cy="48" r="2" fill="#1b4f72"/>
  <circle cx="24" cy="48" r="2" fill="#1b4f72"/>
  <circle cx="16" cy="58" r="2" fill="#1b4f72"/>
  <circle cx="24" cy="58" r="2" fill="#1b4f72"/>
</svg>
