<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 160" width="64" height="160">
  <!-- Top-down container ship. Bow points up (north / heading 0°). -->
  <defs>
    <linearGradient id="hullC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="0.5" stop-color="#5a616b"/>
      <stop offset="1" stop-color="#2c3036"/>
    </linearGradient>
    <linearGradient id="deckC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a929c"/>
      <stop offset="1" stop-color="#6d747e"/>
    </linearGradient>
  </defs>
  <!-- hull silhouette: pointed bow, square stern -->
  <path d="M32 3
           C 44 14, 50 28, 50 44
           L 50 150
           C 50 154, 47 156, 42 156
           L 22 156
           C 17 156, 14 154, 14 150
           L 14 44
           C 14 28, 20 14, 32 3 Z"
        fill="url(#hullC)" stroke="#1c2024" stroke-width="1.5"/>
  <!-- foredeck -->
  <path d="M32 12 C 40 20, 44 30, 44 44 L 20 44 C 20 30, 24 20, 32 12 Z"
        fill="url(#deckC)"/>
  <!-- container bays (stacks) -->
  <g stroke="#2c3036" stroke-width="0.8">
    <rect x="18" y="46" width="28" height="16" fill="#c0392b"/>
    <rect x="18" y="64" width="28" height="16" fill="#2980b9"/>
    <rect x="18" y="82" width="28" height="16" fill="#27ae60"/>
    <rect x="18" y="100" width="28" height="16" fill="#e67e22"/>
    <rect x="18" y="118" width="28" height="14" fill="#8e44ad"/>
    <!-- bay divider lines -->
    <line x1="27" y1="46" x2="27" y2="132"/>
    <line x1="37" y1="46" x2="37" y2="132"/>
  </g>
  <!-- aft superstructure / bridge -->
  <rect x="19" y="134" width="26" height="16" rx="2" fill="#d7dbe0" stroke="#2c3036" stroke-width="0.8"/>
  <rect x="24" y="137" width="16" height="9" rx="1" fill="#aeb6bf"/>
  <!-- bridge windows -->
  <rect x="25" y="138" width="14" height="2.5" fill="#34495e"/>
</svg>
